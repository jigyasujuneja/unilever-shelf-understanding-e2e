# Centralized Product Taxonomy Configuration
# Update this file whenever your category, subcategory, packaging, or size rules change.
# All tasks (Detection, Classification, Hybrid Matching, Fine-Tuning) and the Web UI load this file automatically.
# Note: Brand names (`brand`) and HUL vs. Non-HUL attribution (`is_hul_brand`) are extracted
# openly from the shelf image / connected product catalog without requiring predefined brand lists.

categories:
  - "Skin Care"
  - "Hair Care"
  - "Oral Care"
  - "Skin Cleansing"
  - "Laundry"
  - "Household Care"
  - "Deodorants & Fragrances"
  - "Food & Refreshment"
  - "Baby Care"
  - "Color Cosmetics"

subcategories:
  - "Face Wash"
  - "Face Cream"
  - "Moisturizer"
  - "Serum"
  - "Shampoo"
  - "Conditioner"
  - "Hair Oil"
  - "Toothpaste"
  - "Mouthwash"
  - "Toothbrush"
  - "Bath Soap"
  - "Body Wash"
  - "Hand Wash"
  - "Detergent Powder"
  - "Liquid Detergent"
  - "Laundry Bar"
  - "Dishwash"
  - "Surface Cleaner"

packaging_types:
  - "tube"
  - "box"
  - "bottle"
  - "jar"
  - "sachet"
  - "pouch"
  - "bar"
  - "pump"
  - "can"

pack_types:
  - "Single"
  - "Multiple"

size_buckets:
  sachet_label: "Sachet / Trial (<25g/ml)"
  small_label: "Small / Compact (25-55g/ml)"
  medium_label: "Medium / Regular (56-110g/ml)"
  large_label: "Large / Family (>110g/ml)"
  sachet_max_grams: 25
  small_max_grams: 55
  medium_max_grams: 110
  small_bbox_height_ratio: 0.82
  large_bbox_height_ratio: 1.08

# Optional brand overrides (excluded / empty by default so models detect any brand openly
# and attribute HUL vs. Non-HUL via VLM knowledge or the connected Catalog / Ground Truth table).
hul_brands: []
non_hul_brands: []

# Configurable N-Attribute Extraction (>8 attributes):
# Add any number of additional product or shelf attributes below. They are automatically added to
# the VLM prompt, extracted into `extra_attributes`, and scored in `per_attribute_accuracy` /
# `macro_attribute_accuracy` when present in your ground-truth dataset.
# Example:
#   custom_attributes:
#     price_tag_visible:
#       description: "Whether a retail price tag is visible directly below the product facing"
#       value_type: "boolean"
#       allowed_values: ["true", "false"]
#     promo_callout:
#       description: "Any promotional badge or discount text printed on the package"
#       value_type: "string"
#     facing_orientation:
#       description: "Orientation of the product facing on the shelf"
#       value_type: "string"
#       allowed_values: ["front_straight", "tilted", "sideways", "upside_down"]
#     shelf_talker_present:
#       description: "Whether a promotional shelf talker or wobbler is attached near this slot"
#       value_type: "boolean"
custom_attributes: {}

# Optional VLM Call Grouping for `configurable_multi_attribute_vlm`:
# - Leave empty `[]` (or provide 1 list) to predict ALL attributes (8 core + N custom) in a SINGLE VLM call.
# - Provide 2+ attribute lists to split extraction across multiple targeted VLM calls by attribute type
#   (e.g., Group 1 = OCR/identity attributes, Group 2 = physical packaging & merchandising attributes).
# Example:
#   attribute_call_groups:
#     - ["category", "subcategory", "brand", "product_name", "variant"]
#     - ["packaging_type", "pack_type", "size", "price_tag_visible", "promo_callout", "facing_orientation"]
attribute_call_groups: []
