[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilever-shelf-benchmark"
version = "0.1.0"
description = "Scalable GCP & Vertex AI Gemini Benchmark Suite for Retail Shelf Understanding (Detection, Classification, Matching, Fine-Tuning)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.5.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.17.0",
    "google-auth>=2.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # 0.12.0 is the floor that *implements* UP045 as a rule distinct from UP007.
    # 0.11.x accepts "UP045" in the ignore list below without erroring, but still
    # reports every `Optional[X]` under UP007 -- so `ruff check .` yields 314
    # findings on 0.11.x and 31 on >=0.12. A lint gate whose verdict depends on
    # which patch release the developer happened to resolve is not a gate.
    "ruff>=0.12.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
    # Required by tests/test_config_and_packaging_contracts.py, which builds a real
    # wheel to assert the bundled fixture image is actually packaged. Without this
    # the test skips and the packaging regression can reappear unnoticed.
    "build>=1.0.0",
]

[project.scripts]
shelf-benchmark = "shelf_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Without this the wheel ships no fixture image, and every offline entry point
# (shelf_benchmark.testing.fixture_image_path, make_offline_sdk, OFFLINE_IMAGE_URI)
# raises FileNotFoundError on a non-editable install. `pip install -e .` hides
# this locally and in Docker, so it is only reachable via a real wheel install --
# which is why tests/test_packaging.py builds one.
shelf_benchmark = ["_fixtures/*.png", "_resources/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# --strict-markers turns a typo'd marker into an error instead of a silent no-op,
# which would otherwise let a test that never runs look like a passing test.
addopts = "--strict-markers"
markers = [
    "offline: runs with no network and no GCP credentials. This is the lane CI enforces.",
    "live: requires real GCP credentials and bills real quota. Excluded from CI.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "ui"]
extend-exclude = [".venv", "reports", "build", "dist"]

[tool.ruff.lint]
# Deliberately focused: correctness and import hygiene, not stylistic opinions.
# Add rules here only alongside the cleanup that makes them pass.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not by failing the build
    "E741",    # ambiguous variable names such as `l` appear in existing numeric code
    "B008",    # function calls in argument defaults are used intentionally here
    "B905",    # zip(strict=) is not required for the >=3.10 floor
    "SIM105",  # contextlib.suppress is not always clearer than try/except/pass
    "SIM108",  # forcing ternaries hurts readability in the scoring code

    # Typing-modernization burn-down. These four account for 575 of the 614
    # findings on the tree as of this config landing, and every one of them is a
    # mechanical `typing.Dict` -> `dict` / `Optional[X]` -> `X | None` rewrite.
    # They are parked here so the gate is about new defects rather than a
    # repo-wide rename. Clear them in one dedicated PR with
    # `ruff check --fix src tests`, then delete these four lines. Do not mix that
    # rename into a PR that also changes behaviour.
    "UP006",   # non-PEP585 annotation (Dict, List, Tuple)
    "UP035",   # deprecated typing import
    "UP037",   # quoted annotation
    "UP045",   # non-PEP604 Optional
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins in fixtures and re-import inside test bodies.
"tests/*" = ["B011", "F811"]
# Re-exports are the whole point of package __init__ files.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["shelf_benchmark"]

[tool.mypy]
# Intentionally NOT strict. This codebase is only partially annotated, and a wall
# of errors on day one just teaches people to pass --no-verify. Tighten this over
# time by flipping one flag at a time once the current lane is green.
python_version = "3.10"
files = ["src/shelf_benchmark", "ui"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_redundant_casts = true
warn_unreachable = false
no_implicit_optional = true
pretty = true
exclude = ["^build/", "^dist/", "^reports/"]

[[tool.mypy.overrides]]
# Third-party GCP and telemetry SDKs ship partial or absent type information.
module = [
    "google.*",
    "opentelemetry.*",
    "PIL.*",
]
ignore_missing_imports = true
