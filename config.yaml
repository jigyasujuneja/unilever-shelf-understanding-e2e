# shelf-bench configuration. This is the only config file.

gcp:
  project: unilever-shelf-understanding
  location: global                 # Vertex AI Gemini endpoint
  region: us-central1              # Cloud Run + Cloud Build + bucket region
  data: gs://unilever-shelf-understanding-shelf-images/SKU110K_fixed     # dataset (shelf-bench upload)
  products: gs://unilever-shelf-understanding-shelf-images/HUL_labeled_benchmarks  # labelled products (utils/dataset.py)
  rpc: gs://unilever-shelf-understanding-shelf-images/RPC                # checkout photos + reference gallery (shelf-bench rpc)
  shelves: gs://unilever-shelf-understanding-shelf-images/shelves        # HoloSelecta shelves + gallery (shelf-bench shelves)
  results: gs://unilever-shelf-understanding-shelf-images/results        # run outputs from Cloud Run

# Cloud Run job that executes benchmark runs (shelf-bench cloud-run). One task per
# approach x tier x model. Its compute is priced from the Billing Catalog API (Jobs CPU/Memory
# SKUs for the region) and the task's real duration from the Cloud Run Admin API.
cloud_run:
  job: shelf-bench
  service: perfect-store-control-plane   # leaderboard UI (shelf-bench serve-cloud), private
  cpu: 2
  memory_gib: 4
  parallelism: 6    # tasks at once - concurrent tasks alternate across models
  # Direct VPC egress, needed to reach a private-IP AlloyDB instance. Leave unset otherwise.
  # network: default
  # subnet: default

# Defaults for `shelf-bench run` (all overridable on the command line).
defaults:
  split: test      # leaderboard split
  limit: 50        # images per run (0 = entire split: 2,936 test images). Only runs with this
                   # limit + seed on the test split, from Cloud Run, are ranked.
  seed: 0          # same seed + limit => identical image set for every run
  workers: 4       # images processed concurrently
  tier: [standard] # Gemini PayGo tier(s) to run: standard and/or priority (-t on the CLI)

# OpenTelemetry: one Cloud Trace trace per run (run -> image -> Gemini call spans with every
# token count, traffic type, retry and cost) plus matching Cloud Logging entries (with prompts
# and responses). Links land in summary.json["telemetry"]. SHELF_BENCH_TELEMETRY=0 overrides.
telemetry:
  enabled: true

# Models offered by `shelf-bench list`. Any Vertex Gemini model id works with -m.
models:
  - gemini-3.8-flash
  - gemini-3.5-flash-lite

# Vertex AI Supervised Fine-Tuning (LoRA) endpoints (`shelf-bench tune`).
# When `endpoint` is set (or via $SHELF_BENCH_SFT_ENDPOINT), `Gemini(model)` routes calls to that
# live Vertex AI endpoint in `location` while pricing tokens at `base_model`'s Billing Catalog SKU.
tuned_models:
  gemini-2.5-flash-lite-sft:
    base_model: gemini-2.5-flash-lite
    location: us-central1
    endpoint: projects/unilever-shelf-understanding/locations/us-central1/endpoints/ENDPOINT_ID
  gemini-2.5-flash-sft:
    base_model: gemini-2.5-flash
    location: us-central1
    endpoint: projects/unilever-shelf-understanding/locations/us-central1/endpoints/ENDPOINT_ID

# AlloyDB, for approaches that identify products by vector lookup (utils/alloydb.py has the
# setup SQL and IAM). Approaches read this in setup(): AlloyDB(**config["alloydb"]).
alloydb:
  instance: projects/unilever-shelf-understanding/locations/us-central1/clusters/CLUSTER/instances/INSTANCE
  database: postgres
  ip_type: PRIVATE       # PRIVATE (needs cloud_run.network) | PUBLIC | PSC
  # user: defaults to the IAM user of the current credentials

# Prices are NOT configured here: every run fetches current list prices from GCP's Cloud
# Billing Catalog API (Gemini SKUs per traffic type, Cloud Run, Cloud Storage) and GCP's own
# USD->INR rate, and stores that price sheet in its summary. See src/utils/pricing.py.
#
# Promotions GCP pays back as billing credits are not in the catalog, so they are listed here.
# Applied only to runs on or before `until`, and shown as a separate credit line.
promotions:
  - name: Gemini 3.x Flash introductory pricing (50% credit back on net spend)
    models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.6-flash]
    credit_share: 0.5
    until: 2026-12-31
    source: https://cloud.google.com/vertex-ai/generative-ai/pricing
