# shelf-bench configuration. This is the only config file.

gcp:
  project: ul-fs-s-sandbx-16-prj
  location: global                 # Default Vertex AI Gemini endpoint (auto-falls back to region when regional API is required)
  region: us-central1              # Cloud Run + Cloud Build + BigQuery + SFT tuning fallback region
  bigquery_dataset: hul_golden_catalog  # Serverless BigQuery Golden Catalog dataset
  data: gs://ul-fs-s-sandbx-16-prj-shelf-images/SKU110K_fixed     # dataset (shelf-bench upload)
  products: gs://ul-fs-s-sandbx-16-prj-shelf-images/HUL_labeled_benchmarks  # labelled products (utils/dataset.py)
  rpc: gs://ul-fs-s-sandbx-16-prj-shelf-images/RPC                # checkout photos + reference gallery (shelf-bench rpc)
  shelves: gs://ul-fs-s-sandbx-16-prj-shelf-images/shelves        # HoloSelecta shelves + gallery (shelf-bench shelves)
  tuning: gs://ul-fs-s-sandbx-16-prj-shelf-images/tuning          # SFT training/val jsonl + sheets (shelf-bench tune)
  marketshare: gs://marketshare-datasets                          # pack_data, brand_data, input_data SFT datasets
  hul_golden: gs://marketshare-datasets/derived_manifests/hul_golden          # v2.2 HUL + Non-HUL Golden crop manifest
  hul_variants: gs://marketshare-datasets/derived_manifests/hul_variants      # v2.2 Variant-only crop manifest
  hul_packs: gs://marketshare-datasets/derived_manifests/hul_packs            # v2.2 Packaging-form crop manifest
  gtmerch_golden: gs://marketshare-datasets/derived_manifests/gtmerch_golden  # v2.2 GTMerch 2-class shelf + asset manifest
  ms_json_golden: gs://marketshare-datasets/derived_manifests/ms_json_golden  # v2.2 Verified clean LabelMe store shelf manifest
  hul_promos: gs://marketshare-datasets/derived_manifests/hul_promos          # v2.2 Promo & Price callout Golden subset
  hul_brands: gs://marketshare-datasets/derived_manifests/hul_brands          # v2.2 50/50 Stratified Brand & M&A benchmark
  hul_sessions: gs://marketshare-datasets/derived_manifests/hul_sessions      # v2.2 Multi-facing store session shelf strips
  results: gs://ul-fs-s-sandbx-16-prj-shelf-images/results        # run outputs from Cloud Run

# Legacy InceptionV3 Keras classifiers for `-a cv_classify`. The .h5 files are registered in Vertex AI
# Model Registry and served on these Vertex AI Endpoints (`shelf-bench deploy-cv-endpoints` prints them).
# The brand and variant models' class names are in <model>_classes.json next to their .h5 files.
cv_models:
  brand_model: gs://sos-datasets/legacy-models/mt_brand/marketshare_brand.h5
  pack_model: gs://sos-datasets/legacy-models/mt_pack/marketshare_packtype.h5
  wash_variant_model: gs://sos-datasets/legacy-models/wash_variant/wash_variant.h5
  skin_variant_model: gs://sos-datasets/legacy-models/skin_variant/skin_variant.h5
  p5_variant_model: gs://sos-datasets/legacy-models/p5_variant/p5_variant.h5
  oral_variant_model: gs://sos-datasets/legacy-models/oral_variant/oral_variant.h5
  gen_variant_model: gs://sos-datasets/legacy-models/gen_variant/gen_variant.h5
  nonhul_p6_variant_model: gs://sos-datasets/legacy-models/nonhul_p6_variant/nonhul_p6_variant.h5
  nonhul_gen_variant_model: gs://sos-datasets/legacy-models/nonhul_gen_variant/nonhul_gen_variant.h5
  brand_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/4323610123659378688
  pack_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/5408977633855668224
  wash_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/1656353244349202432
  skin_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/649235777678475264
  p5_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/5038556564504444928
  oral_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/6078888078427029504
  gen_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/4763274037281423360
  nonhul_p6_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/4700786592451657728
  nonhul_gen_variant_endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/5604884217646284800

# Cloud Run job that executes benchmark runs (shelf-bench cloud-run). One task per
# approach x tier x model. Its compute is priced from the Billing Catalog API (Jobs CPU/Memory
# SKUs for the region) and the task's real duration from the Cloud Run Admin API.
cloud_run:
  job: shelf-bench
  service: shelf-ui                        # simple Cloud Run UI service name (also mirrored on perfect-store-control-plane)
  cpu: 4
  memory_gib: 16
  parallelism: 100  # tasks at once - concurrent tasks alternate across models
  # Direct VPC egress, needed to reach a private-IP AlloyDB instance. Leave unset otherwise.
  # network: default
  # subnet: default

# Defaults for `shelf-bench run` (all overridable on the command line).
defaults:
  split: test      # leaderboard split
  limit: 50        # images per run (0 = entire split: 2,936 test images). Only runs with this
                   # limit + seed on the test split, from Cloud Run, are ranked.
  seed: 0          # same seed + limit => identical image set for every run
  workers: 4       # images processed concurrently
  tier: [priority] # Gemini PayGo tier(s) to run: priority (1.8x, default), standard and/or flex (-t on the CLI)

# OpenTelemetry: one Cloud Trace trace per run (run -> image -> Gemini call spans with every
# token count, traffic type, retry and cost) plus matching Cloud Logging entries (with prompts
# and responses). Links land in summary.json["telemetry"]. SHELF_BENCH_TELEMETRY=0 overrides.
telemetry:
  enabled: true

# Models offered by `shelf-bench list`. Any Vertex Gemini model id works with -m.
models:
  - gemini-3.8-flash
  - gemini-3.5-flash
  - gemini-3.5-flash-lite

# Vertex AI Supervised Fine-Tuning (LoRA) endpoints (`shelf-bench tune`).
# Base publisher models (`gemini-3.5-flash-lite`, `gemini-3.5-flash`, `gemini-3.8-flash`) are served
# from `location: global`, while tuned LoRA endpoints (`projects/.../locations/us-central1/endpoints/...`)
# automatically route to their regional endpoint (`us-central1`) and price tokens at `base_model`'s SKU.
tuned_models:
  gemini-3.5-flash-lite-sft:
    base_model: gemini-3.5-flash-lite
    location: global
    endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/ENDPOINT_ID
  gemini-3.5-flash-sft:
    base_model: gemini-3.5-flash
    location: global
    endpoint: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/endpoints/ENDPOINT_ID

# AlloyDB, for approaches that identify products by vector lookup (utils/alloydb.py has the
# setup SQL and IAM). Approaches read this in setup(): AlloyDB(**config["alloydb"]).
alloydb:
  instance: projects/ul-fs-s-sandbx-16-prj/locations/us-central1/clusters/CLUSTER/instances/INSTANCE
  database: postgres
  ip_type: PRIVATE       # PRIVATE (needs cloud_run.network) | PUBLIC | PSC
  # user: defaults to the IAM user of the current credentials

# Cloud SQL for PostgreSQL (pgvector HNSW + Hybrid RRF, stoppable between runs at $0/hr idle):
cloudsql:
  instance: ul-fs-s-sandbx-16-prj:us-central1:shelf-bench-pg
  database: postgres
  ip_type: PUBLIC
  # user: defaults to the IAM user of the current credentials


# Optional OpenJEV / djev (/v1/systemone) server (https://github.com/mmastrac/djev,
# https://github.com/razorback16/openjev). Leave base_url empty to run djev single-step
# logprob + 1 - H(p)/ln(N) entropy calibration natively on Vertex AI Gemini.
openjev:
  base_url: ""           # or set $OPENJEV_BASE_URL (e.g. http://localhost:8000)
  model: openjev-latest  # e.g. openjev-latest or google/diffusiongemma-26B-A4B-it

# Hugging Face open-weight models benchmarked via Vertex AI Custom Job GPU workers (shelf-bench hf-gpu-job):
#   * Cloudflare/clef-flash (Qwen3.5-9B, Apache 2.0) -> 1x NVIDIA_L4 (g2-standard-12)
#   * Cloudflare/clef-27b (Qwen3.5-27B, Apache 2.0) -> 1x NVIDIA_A100_80GB (a2-ultragpu-1g)
#   * Contrastive-LM/CLM-v0.1-8B (Qwen3-VL-8B, Apache 2.0) -> 1x NVIDIA_L4 (g2-standard-12)
hf_gpu_models:
  Cloudflare/clef-flash:
    hf_repo: Cloudflare/clef-flash
    base_arch: Qwen/Qwen3.5-9B
    machine_type: g2-standard-12
    accelerator_type: NVIDIA_L4
    accelerator_count: 1
    serving_container: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:v0.20.0
    base_url: ""         # set automatically inside Vertex AI Custom Job or via $HF_VLLM_BASE_URL
  Cloudflare/clef-27b:
    hf_repo: Cloudflare/clef-27b
    base_arch: Qwen/Qwen3.5-27B
    machine_type: g2-standard-48
    accelerator_type: NVIDIA_L4
    accelerator_count: 4
    serving_container: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:v0.20.0
    base_url: ""
  Contrastive-LM/CLM-v0.1-8B:
    hf_repo: Contrastive-LM/CLM-v0.1-8B
    base_arch: Qwen/Qwen3-VL-8B-Instruct
    machine_type: g2-standard-12
    accelerator_type: NVIDIA_L4
    accelerator_count: 1
    serving_container: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:v0.20.0
    base_url: ""


# Prices are NOT configured here: every run fetches current list prices from GCP's Cloud
# Billing Catalog API (Gemini SKUs per traffic type, Cloud Run, Cloud Storage) and GCP's own
# USD->INR rate, and stores that price sheet in its summary. See src/utils/pricing.py.
#
# Promotions GCP pays back as billing credits are not in the catalog, so they are listed here.
# Applied only to runs on or before `until`, and shown as a separate credit line.
promotions:
  - name: Gemini 3.x Flash introductory pricing (50% credit back on net spend)
    models: [gemini-3.5-flash, gemini-3.8-flash, gemini-3.7-flash, gemini-3.6-flash]
    credit_share: 0.5
    until: 2026-12-31
    source: https://cloud.google.com/vertex-ai/generative-ai/pricing
