name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package declares requires-python >=3.10; the container runs 3.11.
        # Test both ends so neither drifts out of support silently.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        # Pinned, not floating: a new ruff release adding a rule would otherwise
        # turn a green PR red with no change to this repository. Keep in sync with
        # .pre-commit-config.yaml and re-measure the CONTRIBUTING.md baseline on bump.
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff --version
          ruff check .
        env:
          RUFF_VERSION: "0.16.8"

      - name: Type check (mypy)
        run: mypy
        # Not yet blocking: the tree is only partially annotated and mypy has
        # never run in CI, so this starts as a signal. Remove this line once the
        # backlog is burned down (see AUDIT.md Stage 1).
        continue-on-error: true

      - name: Tests (offline lane)
        run: pytest -q -m "not live"

  packaging:
    # Guards the defect where the wheel shipped without _fixtures/*.png, which
    # `pip install -e .` masks. Only a real, non-editable install catches it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl

      - name: The offline entry point must work from a non-editable install
        run: |
          /tmp/wheeltest/bin/python - <<'PY'
          from shelf_benchmark.testing import fixture_image_path
          path = fixture_image_path()
          assert path.exists(), f"bundled fixture missing at {path}"
          print(f"OK: {path} ({path.stat().st_size} bytes)")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run image
        run: docker build -t shelf-benchmark:ci .
